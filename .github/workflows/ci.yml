name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: pipx install uv==0.12.23
      - run: uv sync --frozen --group dev --python 3.14
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen mypy src/discode --strict
      # Testcontainers provisions isolated PostgreSQL/Redis on the runner's Docker daemon.
      - run: docker info
      - run: uv run --frozen pytest -q
      - run: uv build
      - name: Audit locked dependencies
        shell: bash
        run: |
          set -o pipefail
          uv export --frozen --no-emit-project --format requirements-txt | uvx pip-audit --disable-pip -r /dev/stdin
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Install gitleaks (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
