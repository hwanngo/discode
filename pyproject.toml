[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discode"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.5",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.14.2",  # >=2.14.2 fixes GHSA NestedSecretsSettingsSource symlink local-file-read
    "starlette>=1.3.1",  # >=1.3.1 fixes GHSA form() limits silently ignored urlencoded DoS (transitive via fastapi)
    "structlog>=24",
    "cryptography>=50",  # >=50 fixes GHSA-g6cj-pr64-35w5 PKCS#7 EnvelopedData Bleichenbacher oracle
    "aiohttp>=3.14.3",  # >=3.14.3 fixes GHSA-cq5v-8q36-5273, GHSA-mfx4-hv73-q22v, GHSA-mq44-7p77-q5h7
]

[project.scripts]
discode-bot = "discode.bot.main:main"
discode-runner = "discode.runner.main:main"
discode-dispatcher = "discode.dispatcher.main:main"
discode-janitor = "discode.janitor.main:main"
discode-claude-hook = "discode.tools.claude_hook:main"
discode-claude-sdk-launch = "discode.tools.claude_sdk_launcher:main"
discode-opencode-launch = "discode.tools.opencode_launcher:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis]>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/discode"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
