[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "discode"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "SQLAlchemy[asyncio]>=2.1.3",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "redis>=8.1.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",  # >=2.14.2 fixes GHSA NestedSecretsSettingsSource symlink local-file-read
    "starlette>=1.7.0",  # >=1.3.1 fixes GHSA form() limits silently ignored urlencoded DoS (transitive via fastapi)
    "httpx>=0.28.1",
    "anyio>=4.15.1",  # >=4.14.2 fixes GHSA TLSStream IDNA 2003 cert spoofing + process-pool stderr hang
    "cryptography>=50.0.2",  # >=50 fixes GHSA-g6cj-pr64-35w5 PKCS#7 EnvelopedData Bleichenbacher oracle
    "aiohttp>=3.14.3",  # >=3.14.3 fixes GHSA-cq5v-8q36-5273, GHSA-mfx4-hv73-q22v, GHSA-mq44-7p77-q5h7
]

[project.scripts]
discode-bot = "discode.bot.main:main"
discode-runner = "discode.runner.main:main"
discode-dispatcher = "discode.dispatcher.main:main"
discode-janitor = "discode.janitor.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[tool.uv]
prerelease = "disallow"

[tool.hatch.build.targets.wheel]
packages = ["src/discode"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
